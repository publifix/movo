name: Measure production

# Manual: measures the live site (headers, Lighthouse mobile, network traces on Fast 4G,
# WebKit/iPhone 14 + Chromium/Pixel 7 in portrait and landscape). Results are printed to the log.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL
        default: https://publifix.github.io/movo/
      label:
        description: Label for this run (before / after)
        default: run

permissions:
  contents: read
  pages: read
  deployments: read

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Pages source and latest deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Pages config"; gh api repos/${{ github.repository }}/pages --jq '{build_type, source, html_url, https_enforced}' || true
          echo "## Latest github-pages deployments"
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" \
            --jq '.[] | {sha: .sha[0:7], ref, created_at}'
          echo "## Last successful deploy runs"
          gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=3" \
            --jq '.workflow_runs[] | {branch: .head_branch, sha: .head_sha[0:7], updated_at}'
      - name: Status, caching, compression and Range support
        run: |
          U="${{ inputs.url }}"
          check() {
            printf '\n### %s\n' "$1"
            curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$U$1" \
              | grep -iE '^(HTTP/|content-type|content-length|content-encoding|cache-control|accept-ranges|etag|last-modified|age|x-cache)' || true
          }
          html=$(curl -s "$U")
          for f in "" en/ robots.txt sitemap.xml og/movo-og-1200x630.jpg $(echo "$html" | grep -oE '(assets/[^"]+)' | sort -u) \
                   video/hero/movo-hero-mobile-720x1280.mp4 video/hero/movo-hero-mobile-720x1280.webm video/hero/movo-hero-mobile-poster.jpg \
                   video/hero/movo-hero-1920x1080.mp4 video/hero/movo-hero-1920x1080.webm video/hero/movo-hero-poster.jpg \
                   video/intro/movo-intro-v2-1920x1080.webm video/intro/movo-intro-v2-1920x1080.mp4; do
            check "$f"
          done
          echo; echo "## Range requests (expect 206 and 1024 bytes)"
          for f in video/hero/movo-hero-mobile-720x1280.mp4 video/hero/movo-hero-1920x1080.webm; do
            curl -s -o /dev/null -r 0-1023 -w "$f -> %{http_code} %{size_download} bytes\n" "$U$f"
          done
          echo; echo "## Served index.html references"; echo "$html" | grep -oE '(src|href)="[^"]*"' | grep -vE '^href="#' | head -30

  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright@1.64.1 install --with-deps webkit
      - name: Lighthouse mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx -y lighthouse@13.5.0 "${{ inputs.url }}" --only-categories=performance --output=json --output-path=lh.json \
            --chrome-flags="--headless=new --no-sandbox" --quiet || true
          node -e '
            const d = require("./lh.json"), a = d.audits;
            console.log("score", Math.round(d.categories.performance.score * 100), d.configSettings.formFactor, d.configSettings.throttlingMethod);
            for (const k of ["first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","cumulative-layout-shift","total-byte-weight"]) console.log(k, a[k].displayValue);
            try { console.log("LCP element", a["largest-contentful-paint-element"].details.items[0].items[0].node.snippet.slice(0, 140)); } catch {}
            for (const r of a["network-requests"].details.items) console.log(String(Math.round(r.networkRequestTime)).padStart(7), "->", String(Math.round(r.networkEndTime)).padStart(7), "ms", (r.transferSize/1024).toFixed(1).padStart(8), "KB", r.statusCode, r.resourceType, r.url.split("/").slice(4).join("/"));'
      - name: Network traces
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          U="${{ inputs.url }}"
          run() { echo "::group::$*"; node scripts/perf/measure.mjs "$U" "$@" > out.json || true; node -e '
            const d = require("./out.json"), m = d.metrics;
            console.log("RESULT", JSON.stringify({ device: d.device, landscape: d.landscape, browser: d.browser, throttle: d.throttle, enter: d.enter, repeat: d.repeat, enteredAt: d.enteredAt, totalKB: d.totalKB, requests: d.requests, heroVideoFiles: d.heroVideoFiles,
              lcp: Math.round(m.lcp), lcpEl: m.lcpEl, introShown: m.introShown, introDone: m.introDone && Math.round(m.introDone), heroPlaying: m.heroPlaying && Math.round(m.heroPlaying), heroSrc: m.heroSrc, heroPoster: m.heroPoster, heroPaused: m.heroPaused, heroVideoSize: m.heroVideoSize, heroRect: m.heroRect, viewport: m.viewport, errors: m.errors, intro: m.intro }));
            for (const r of d.rows) console.log(String(r.startMs).padStart(7), "->", String(r.endMs).padStart(7), "ms", String(r.kb).padStart(8), "KB", r.status, r.type, r.file, r.range || "", r.enc || "", r.failed || "");' ; echo "::endgroup::"; }
          run --device pixel7 --wait 15000
          run --device pixel7 --enter --wait 24000
          run --device pixel7 --repeat --wait 10000
          run --device desktop --enter --wait 24000
          run --device pixel7 --landscape --wait 12000
          run --device iphone14 --browser webkit --wait 12000
          run --device iphone14 --browser webkit --landscape --wait 12000
          run --device iphone14 --browser webkit --viewport 980x1743 --mac-ua --wait 12000
          run --device ipad --browser webkit --wait 12000
          run --device ipad --browser webkit --landscape --wait 12000
