name: Check site pages

# Manual. Real browsers against the live site (the sandbox where it is developed cannot reach github.io):
# the Studio page and the home teaser (scripts/perf/studio-check.mjs), and the Work page, every project
# page, Contact and the privacy notice (scripts/perf/pages-check.mjs), ES + EN, Chrome (desktop, Pixel 7)
# and WebKit (iPhone 14).
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site root URL
        default: https://www.movomotiondesign.com/

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright@1.64.1 install --with-deps webkit
      - name: Studio page + home teaser
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for dev in desktop desktop1920 pixel7 iphone14; do
            echo "::group::$dev"
            node scripts/perf/studio-check.mjs "${{ inputs.site }}" --device "$dev" || true
            echo "::endgroup::"
          done
      - name: Work, projects, contact, privacy
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for dev in desktop pixel7 iphone14; do
            echo "::group::pages $dev"
            node scripts/perf/pages-check.mjs "${{ inputs.site }}" --device "$dev" || true
            echo "::endgroup::"
          done
