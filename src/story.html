<!doctype html>
<!-- One MOVO Story per entry of src/data/stories.json and language: /stories/<slug>/, /en/stories/<slug>/.
     Generated by scripts/i18n/vite-plugin-i18n.mjs + stories-markup.mjs (the stubs are git-ignored).
     Playbook: STORIES.md (4 acts: Quieto, Chispa, Movimiento, Resultado). -->
<html lang="{{lang}}" data-root="{{root}}" data-page="story"{{htmlPreview}}>
  <head>
    {{> page-head}}
    <link rel="stylesheet" href="/src/stories/story.css" />
    <script type="application/json" id="movo-i18n">{{uiJson}}</script>
  </head>
  <body>
    {{> header}}

    <main id="main" class="sp">
      <nav class="sp-crumbs sp-wrap" aria-label="{{stories.crumbs}}">
        <a href="{{storiesHref}}">{{stories.h1}}</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">{{storyNum}}</span>
      </nav>

      <article class="sp-article" aria-labelledby="sp-title">
        <header class="sp-head sp-wrap" data-clip="intro" data-clip-start="0" data-clip-label="{{storyNum}}">
          <p class="sp-label">{{stories.label}} · {{storyNum}}</p>
          <h1 class="sp-title" id="sp-title">{{storyTitle}}</h1>
          <p class="sp-dek">{{storyDek}}</p>
        </header>
        <div class="sp-cover sp-wrap">{{storyCover}}</div>
        <div class="sp-body sp-wrap">
          {{storyDraft}}
        </div>
      </article>

      <section class="sx-close sp-wrap" aria-labelledby="sp-close-title" data-clip="closing" data-clip-label="{{contact.label}}">
        <h2 class="sx-close__title" id="sp-close-title">{{workPage.closingTitle}}</h2>
        <p class="sx-close__text">{{workPage.closingText}}</p>
        <a class="btn btn--volt" href="{{contactHref}}">{{hero.cta}}</a>
      </section>
    </main>

    {{> footer}}

    {{> timecode}}

    <script type="module" src="/src/stories/story.js"></script>
  </body>
</html>
