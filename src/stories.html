<!doctype html>
<!-- MOVO Stories index for every language: /stories/, /en/stories/. Generated from src/data/stories.json
     (scripts/i18n/stories-markup.mjs): the newest story is featured (its cover scene, final frame); from 3
     stories on, a plain list of titles follows. Playbook: STORIES.md. -->
<html lang="{{lang}}" data-root="{{root}}" data-page="stories"{{htmlPreview}}>
  <head>
    {{> page-head}}
    <link rel="stylesheet" href="/src/stories/index.css" />
    <script type="application/json" id="movo-i18n">{{uiJson}}</script>
  </head>
  <body>
    {{> header}}

    <main id="main" class="sx">
      <header class="sx-hero sx-wrap" data-clip="intro" data-clip-start="0" data-clip-label="{{stories.label}}">
        <h1 class="sx-hero__title">{{stories.h1}}</h1>
        <p class="sx-hero__dek">{{stories.dek}}</p>
      </header>

      <section class="sx-body sx-wrap" aria-label="{{stories.h1}}" data-clip="stories" data-clip-label="{{stories.featured}}">
        {{storiesFeatured}}
        {{storiesList}}
      </section>

      <section class="sx-close sx-wrap" aria-labelledby="sx-close-title" data-clip="closing" data-clip-label="{{contact.label}}">
        <h2 class="sx-close__title" id="sx-close-title">{{workPage.closingTitle}}</h2>
        <p class="sx-close__text">{{workPage.closingText}}</p>
        <a class="btn btn--volt" href="{{contactHref}}">{{hero.cta}}</a>
      </section>
    </main>

    {{> footer}}

    {{> timecode}}

    <script type="module" src="/src/stories/index.js"></script>
  </body>
</html>
